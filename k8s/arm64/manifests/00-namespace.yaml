---
apiVersion: v1
kind: Namespace
metadata:
  name: ortho32
  labels:
    pod-security.kubernetes.io/enforce: restricted
---
# No inbound traffic to any pod unless a later policy opens it.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: ortho32
spec:
  podSelector: {}
  policyTypes: [Ingress]
