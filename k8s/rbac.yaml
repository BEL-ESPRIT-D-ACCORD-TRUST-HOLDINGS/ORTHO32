---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ortho32-verifier
  namespace: ortho32-verification
  labels:
    app: ortho32-verification
    component: service-account
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ortho32-job-runner
  namespace: ortho32-verification
  labels:
    app: ortho32-verification
    component: rbac
rules:
  - apiGroups: [""]
    resources: ["pods", "pods/log"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["persistentvolumeclaims"]
    verbs: ["get", "list"]
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "list", "watch", "create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ortho32-verifier-binding
  namespace: ortho32-verification
  labels:
    app: ortho32-verification
    component: rbac
subjects:
  - kind: ServiceAccount
    name: ortho32-verifier
    namespace: ortho32-verification
roleRef:
  kind: Role
  name: ortho32-job-runner
  apiGroup: rbac.authorization.k8s.io
