---
apiVersion: v1
kind: Namespace
metadata:
  name: ortho32-verification
  labels:
    name: ortho32-verification
    component: deterministic-verification
    entropy-level: "0.0"
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: ortho32-quota
  namespace: ortho32-verification
spec:
  hard:
    requests.cpu: "32"
    requests.memory: "64Gi"
    limits.cpu: "64"
    limits.memory: "128Gi"
    persistentvolumeclaims: "5"
    pods: "10"
    jobs.batch: "5"
